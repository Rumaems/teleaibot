services:
  - type: web
    name: flow-ai-kpc
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: BOT_NAME
        value: КПК
      - key: AUTONOMOUS_MINUTES
        value: "12"
      - key: SILENCE_SECONDS
        value: "10"
